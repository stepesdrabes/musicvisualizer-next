[package]
name = "room-node"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", features = [
	"udp",
	"dhcpv4",
	"dhcpv4-hostname",
	"medium-ethernet",
	"proto-ipv4",
	# Answering ping is how the board is found on the LAN and how round-trip time gets measured
	# independently of the DDP stream.
	"auto-icmp-echo-reply",
	"log"
] }
embassy-rp = { version = "0.10.0", features = ["rp2040", "time-driver", "critical-section-impl"] }
embassy-time = "0.5.1"
embassy-usb-logger = "0.6.0"
cyw43 = { version = "0.7.0", features = ["log"] }
cyw43-pio = "0.10.0"

cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.0"
critical-section = "1.1"
heapless = "0.9"
log = "0.4"
panic-reset = "0.1.1"
static_cell = "2.1"

# thumbv6m has no CAS instructions; embassy needs the critical-section fallback to link.
portable-atomic = { version = "1.5", features = ["critical-section"] }

# A debug-profile cyw43 is too slow to keep the SPI bus fed and the join times out.
[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2
